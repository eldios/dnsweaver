# Publishes ghcr.io/eldios/dnsweaver:<short commit> from the homelab branch,
# the image the reverse-proxy stack on x pins.
name: homelab image

on:
  push:
    branches: [homelab]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: tag
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          build-args: VERSION=${{ steps.tag.outputs.sha }}
          push: true
          tags: ghcr.io/eldios/dnsweaver:${{ steps.tag.outputs.sha }}
